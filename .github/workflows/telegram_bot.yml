name: бот дедлайнов PhoenixTrello

# Запускаем каждый день: внутри функции у каждой карточки свой таймер.
#   ддл дальше 7 дней — раз в неделю (только по понедельникам)
#   ддл ≤ 7 дней        — раз в 2 дня
#   просрочено           — раз в 4 дня
#   без ддл              — раз в неделю (только по понедельникам)
# Время — 07:03 UTC, это 10:03 по Москве.
# Минута 3 — чтобы не попадать в пиковую очередь GitHub.
on:
  schedule:
    - cron: '3 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Отправить всё, даже если по карточке интервал ещё не вышел'
        required: false
        default: 'false'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: попросить бота собрать и разослать дайджест
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BOT_SECRET: ${{ secrets.BOT_SECRET }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          # --- диагностика: показываем, какие секреты заданы (значения не печатаем) ---
          echo "SUPABASE_URL: ${SUPABASE_URL:-(не задан)}"
          echo "SUPABASE_ANON_KEY: $([ -n "$SUPABASE_ANON_KEY" ] && echo задан || echo НЕ ЗАДАН)"
          echo "BOT_SECRET: $([ -n "$BOT_SECRET" ] && echo задан || echo НЕ ЗАДАН)"
          echo "force: ${FORCE_INPUT:-false}"
          echo

          force="false"
          if [ "$FORCE_INPUT" = "true" ]; then force="true"; fi

          url="$SUPABASE_URL/functions/v1/telegram-bot/dispatch"
          echo "POST $url"
          echo

          # пишем ответ в файл, чтобы показать и код, и тело
          resp=$(mktemp)
          code=$(curl -sS -o "$resp" -w '%{http_code}' -X POST "$url" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-bot-secret: $BOT_SECRET" \
            -d "{\"force\": $force}")

          echo "HTTP $code"
          echo "--- ответ функции ---"
          cat "$resp"
          echo
          echo "--- конец ответа ---"
          rm -f "$resp"

          # 4xx/5xx — функция сломалась или секрет не тот, подсвечиваем ошибкой
          case "$code" in
            2*) echo "ок" ;;
            *)  echo "::error::функция ответила кодом $code — проверь секреты, деплой и Verify JWT"
                exit 1 ;;
          esac
